[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencedesk"
version = "0.1.0"
description = "A research brief with a verifiable evidence trail for every published claim."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
evidencedesk = "evidencedesk.__main__:main"

[tool.setuptools.package-data]
evidencedesk = ["web/*"]

[tool.setuptools.packages.find]
include = ["evidencedesk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
